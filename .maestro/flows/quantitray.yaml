appId: ${APP_ID}
name: QuantiTray lookup shows MPN and confidence range
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn:
    id: qt-button
- assertVisible: QuantiTray® MPN
# 0 positive wells
- assertVisible:
    id: qt-mpn-number
- assertVisible: 'MPN: <1\.0'
# 10 positive wells -> 11.1 (6.1 - 20.5)
- tapOn:
    id: qt-input
- eraseText
- inputText: '10'
# Tap outside the inputs to close the keyboard (works on iOS and Android)
- tapOn: Positive Wells
- assertVisible:
    id: qt-mpn-number
- assertVisible: 'MPN: 11\.1'
- assertVisible: 'Low: 6\.1'
- assertVisible: 'High: 20\.5'
# iOS: the number pad has no return key, so the Done bar above it closes the keyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: qt-input
      - tapOn:
          id: keyboard-done
      - assertNotVisible:
          id: keyboard-done
      - assertVisible: 'MPN: 11\.1'
- scrollUntilVisible:
    element:
      id: back-button
    direction: DOWN
- tapOn:
    id: back-button
- assertVisible:
    id: qt-button
