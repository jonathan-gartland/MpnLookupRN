appId: ${APP_ID}
name: QuantiTray 2000 lookup uses large and small wells
---
- launchApp:
    clearState: true
- tapOn:
    id: qt2k-button
- assertVisible: QuantiTray2000® MPN
# 10 large + 5 small positive wells -> 16.6 (9.6 - 26.8)
- tapOn:
    id: qt2k-large
- eraseText
- inputText: '10'
- tapOn:
    id: qt2k-small
- eraseText
- inputText: '5'
- hideKeyboard
- assertVisible:
    id: qt2k-mpn-number
    text: 'MPN: 16\.6'
- assertVisible: 'Low: 9\.6'
- assertVisible: 'High: 26\.8'
