# ✍️ Description:
# Runs the Maestro tests in .maestro/ against an APK built by EAS.
# Paste the EAS APK URL when triggering the workflow manually from the Actions tab.
# The emulator runs on a Linux runner with KVM, same as e2e-android.yml.
#
# 🚨 GITHUB SECRETS REQUIRED: None

name: E2E Tests EAS Build Android (Maestro)

on:
  workflow_dispatch:
    inputs:
      apk-url:
        type: string
        description: EAS APK URL
        required: true
        default: ''
      app-id:
        type: string
        description: Android package of the build (e.g. com.mpnlookuprn.staging)
        required: true
        default: com.mpnlookuprn.staging

env:
  API_LEVEL: 34
  EMULATOR_PROFILE: pixel_6
  MAESTRO_VERSION: 2.12.1
  APK_URL: ${{ github.event.inputs.apk-url }}
  APP_ID: ${{ github.event.inputs.app-id }}

jobs:
  test-android:
    if: github.event.inputs.apk-url != ''
    name: E2E Tests EAS Build Android (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Download EAS APK
        run: wget "$APK_URL" -O ./app-release.apk

      - name: ⚡ Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📦 Install Maestro
        run: |
          # MAESTRO_VERSION (set above) pins the CLI version the install script fetches
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 💾 AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-${{ env.EMULATOR_PROFILE }}

      - name: 📱 Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: 🧪 Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install ./app-release.apk
            maestro test .maestro --env APP_ID="$APP_ID" --format junit --output maestro-report.xml --test-output-dir maestro-output

      - name: 📤 Upload Maestro report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-eas-results
          path: |
            maestro-report.xml
            maestro-output/
          if-no-files-found: ignore
