# ✍️ Description:
# Runs the Maestro end-to-end tests in .maestro/ on an Android emulator inside GitHub Actions.
# 1. Builds a staging release APK (JS bundled in, so no Metro server is needed).
# 2. Boots an x86_64 emulator on a Linux runner (hardware accelerated via KVM).
# 3. Installs the APK and runs `maestro test .maestro`.
#
# Triggers:
#   - Pushes to main
#   - Pull requests to main that carry the `e2e-android` label (add the label to run it)
#   - Manually from the Actions tab
#
# 🚨 GITHUB SECRETS REQUIRED: None

name: E2E Tests Android (Maestro)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 34

jobs:
  e2e-android:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-android')
    name: Build APK + Run Maestro (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 📦 Set Up JDK + Generate Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: staging
          ARCHITECTURES: x86_64

      - name: ⚡ Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📦 Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: 💾 AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64

      - name: 📱 Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: 🧪 Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install ./android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro --env APP_ID=com.mpnlookuprn.staging --format junit --output maestro-report.xml --debug-output maestro-output

      - name: 📤 Upload Maestro report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-results
          path: |
            maestro-report.xml
            maestro-output/
            ~/.maestro/tests/
          if-no-files-found: ignore
